<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation du logo</title>
<style>
body{margin:0;background:#FCFBF9;font:15px/1.4 system-ui,sans-serif;color:#241C15;display:flex;flex-direction:column;align-items:center;gap:22px;padding:40px 16px}
.stage{width:min(560px,92vw);padding:34px 24px;background:#fff;border:1px solid #ECE6DC;border-radius:20px}
svg{width:100%;height:auto;display:block;overflow:visible}
.fb{transform-box:fill-box}
button{font:600 14px system-ui;padding:10px 18px;border-radius:44px;border:0;background:#B8471F;color:#fff;cursor:pointer}
button.alt{background:#F1ECE3;color:#241C15}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
small{color:#6E6457;max-width:520px;text-align:center}
/* intro */
.play .bub{transform-origin:50% 55%;animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.play .dot{transform-origin:50% 50%;animation:dotin .2s .35s both,bounce .5s .5s ease-in-out 1,dotout .15s 1.1s forwards}
.play .dot:nth-child(2){animation-delay:.35s,.62s,1.1s}.play .dot:nth-child(3){animation-delay:.35s,.74s,1.1s}
.play .dot:nth-child(1){animation-delay:.35s,.5s,1.1s}
.play .nn{transform-origin:50% 50%;animation:nin .3s 1.15s cubic-bezier(.3,1.5,.5,1) both}
.play .leaf{transform-origin:0% 100%;animation:sway .8s 1.4s ease-in-out both}
.play .word{animation:wordin .5s .9s ease-out both}
/* loading */
.load .bub{transform-origin:50% 55%;animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.load .dot{transform-origin:50% 50%;animation:bounce .9s ease-in-out infinite}
.load .dot:nth-child(2){animation-delay:.15s}.load .dot:nth-child(3){animation-delay:.3s}
.load .nn{opacity:0}.load .word{opacity:.0}
.done .dot{animation:dotout .15s forwards!important}
.done .nn{animation:nin .3s .15s cubic-bezier(.3,1.5,.5,1) both!important;opacity:1}
.done .word{animation:wordin .5s .2s ease-out both!important;opacity:1}
.done .leaf{transform-origin:0% 100%;animation:sway .8s .45s ease-in-out both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes dotin{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes dotout{to{opacity:0;transform:scale(.3)}}
@keyframes nin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes sway{0%{transform:rotate(0)}30%{transform:rotate(-14deg)}65%{transform:rotate(7deg)}100%{transform:rotate(0)}}
@keyframes wordin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.dot,.nn,.leaf,.word,.bub{transform-box:fill-box}
.play .dot{opacity:0}.play .nn{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dot{opacity:0!important}.nn,.word{opacity:1!important}}
</style>

<div class="row"><button onclick="play()">Rejouer l'arrivée (login)</button><button class="alt" onclick="loading()">Écran de chargement (boucle)</button><button class="alt" id="ok" onclick="done()" disabled>Connexion prête</button></div>
<small>Arrivée : la bulle apparaît, les points de saisie rebondissent, puis deviennent le n, la feuille se balance et le mot arrive. Chargement : les points tournent tant que l'app se connecte, puis se résolvent en n.</small>
<script>
const s=document.getElementById('logo'),ok=document.getElementById('ok');
function reset(c){s.setAttribute('class','');void s.getBoundingClientRect();s.setAttribute('class',c)}
function play(){ok.disabled=true;reset('play')}
function loading(){reset('load');ok.disabled=false}
function done(){s.setAttribute('class','load done');ok.disabled=true}
</script></html>
